[project]
name = "riskpilot-8d"
version = "0.1.0"
description = "Multidimensional real-time market-risk platform"
authors = [{ name = "RiskPilot Team" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
